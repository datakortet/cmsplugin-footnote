name: Wheel

# Build the py3 wheel on every push and pull request; on master, publish
# it to pypi.norsktest.xyz (INTERN-155). /srv CI takes our package names
# from that index only, and it holds only py2 wheels of
# cmsplugin-footnote, so py3 CI that needs it cannot install it.
#
# This follows the .wheel job of norsktest/dktools ci-templates/wheel.yml.
# scripts/s3index.py is a verbatim copy of dktools/dktools/s3index.py.
#
# Publishing needs two repository (or organisation) secrets with write
# access to the pypi.norsktest.xyz bucket:
#   PYPI_NORSKTEST_AWS_ACCESS_KEY_ID, PYPI_NORSKTEST_AWS_SECRET_ACCESS_KEY

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the py3 wheel (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine pytest

      - name: Test that the wheel builds
        run: python -m pytest -p no:cacheprovider --noconftest tests/test_wheel.py

      - name: Build the sdist and wheel
        run: python -m build

      - name: Check the distributions
        run: python -m twine check --strict dist/*

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to pypi.norsktest.xyz
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      github.repository == 'datakortet/cmsplugin-footnote'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PYPI_NORSKTEST_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PYPI_NORSKTEST_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Check the publish credentials
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Add the PYPI_NORSKTEST_AWS_* secrets to publish to pypi.norsktest.xyz"
            exit 1
          fi

      - name: Install s3pypi
        run: python -m pip install --upgrade pip s3pypi

      - name: Upload to pypi.norsktest.xyz
        run: s3pypi upload --index.html --s3-put-args='ACL=public-read' --force --bucket pypi.norsktest.xyz dist/*

      # s3pypi only writes <package>/index.html, but pip over the HTTPS
      # REST endpoint reads the <package>/ object: copy index.html there
      # and verify both (dktools#4).
      - name: Sync and verify the index
        run: >-
          python scripts/s3index.py --bucket pypi.norsktest.xyz
          --url https://s3.eu-west-1.amazonaws.com/pypi.norsktest.xyz
          --acl public-read dist/*
